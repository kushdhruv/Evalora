# Pyrefly Configuration for Evalora
# Docs: https://pyrefly.org/en/docs/IDE/

project-includes = [
    "core/**/*.py",
    "evalora/**/*.py",
    "cli/**/*.py",
    "server/**/*.py",
    "demo_agent/**/*.py",
    "tests/**/*.py",
]

project-excludes = [
    "**/__pycache__/**",
    "**/.pytest_cache/**",
    "**/node_modules/**",
    "**/web/dist/**",
    "**/.git/**",
]

use-ignore-files = true

search-path = [
    ".",
    "core",
    "evalora",
]

site-package-path = [
    "C:/Users/dhruv/AppData/Local/Programs/Python/Python314/Lib/site-packages",
]

python-platform = "windows"
python-version = "3.14"

untyped-def-behavior = "check-and-infer-return-type"

